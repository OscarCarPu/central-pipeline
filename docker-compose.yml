services:
  db:
    image: postgres:18
    container_name: db_central_pipeline
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - "${POSTGRES_PORT:-54321}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker 
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s 
      timeout: 5s 
      retries: 5

  consumer:
    build: .
    container_name: consumer_central_pipeline
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      MQTT_HOST: ${MQTT_HOST_DOCKER:-host.docker.internal}
      MQTT_PORT: ${MQTT_PORT:?}
      MQTT_USERNAME: ${MQTT_USERNAME:?}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?}

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.latest
    profiles: ["tools"]
    depends_on:
      db: {condition: service_healthy}
    environment:
      POSTGRES_HOST: db 
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      DBT_PROFILES_DIR: /usr/app
    volumes:
      - ./dbt:/usr/app
    user: "${UID:-1000}:${GID:-1000}"

volumes:
  postgres_data:
